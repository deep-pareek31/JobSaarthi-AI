version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jobsaarthi_postgres
    environment:
      POSTGRES_USER: jobsaarthi
      POSTGRES_PASSWORD: jobsaarthi_secure_pass
      POSTGRES_DB: jobsaarthi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsaarthi -d jobsaarthi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobsaarthi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobsaarthi_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://jobsaarthi:jobsaarthi_secure_pass@postgres:5432/jobsaarthi_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
